# Synology Container Manager → 프로젝트 → 생성 에서 이 파일을 그대로 붙여 넣거나,
# SSH 로 접속해 `docker compose up -d` 로 띄우면 됩니다.
services:
  peru-glacier-monitor:
    build: .
    container_name: peru-glacier-monitor
    restart: unless-stopped
    ports:
      # 왼쪽이 NAS 에서 열 포트입니다. 8080 이 이미 쓰이면 8081 등으로 바꾸세요.
      - "8080:8080"
    volumes:
      # 수집 이력이 쌓이는 곳. 컨테이너를 지워도 데이터가 남도록 NAS 경로에 붙입니다.
      # Synology 라면 File Station 에서 docker/peru-glacier 폴더를 먼저 만들어 두세요.
      - ./data:/data
    environment:
      TZ: Asia/Seoul
      DATA_DIR: /data
      # 수집 주기(분). 기상 예보가 보통 1시간 단위로 갱신되므로 30~60 이 적당합니다.
      POLL_MINUTES: "30"
      # 위험도가 이 값을 넘으면 웹훅으로 알립니다 (지점당 6시간 쿨다운).
      # Synology Chat · Slack · Discord · ntfy 등의 수신 URL 을 넣으세요.
      # ALERT_WEBHOOK: "https://example.com/webhook"
      # ALERT_THRESHOLD: "50"
      #
      # 배포 직후 파이프라인 점검용. 합성 데이터를 쓰므로 확인이 끝나면 반드시 지우세요.
      # DEMO: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
